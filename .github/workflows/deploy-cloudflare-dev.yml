name: Deploy Cloudflare dev (Base mainnet)
# Every green CI run on main redeploys the three oracle nodes (one at a time), the trading UI, the docs
# and the dev runtime container.
# Contracts are deployed and upgraded separately by dev-contracts.yml.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-dev
  cancel-in-progress: false
jobs:
  # Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID turn this on.
  configured:
    # Only a push to this repository's main may deploy. A fork PR opened from its own main branch also
    # matches the workflow_run branch filter, so check the event, repository and branch explicitly.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare secrets are not set; skipping the dev deploy"; fi
  deploy:
    needs: configured
    if: ${{ needs.configured.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
      RFQ_BASE_MAINNET_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_RPC_URL }}
      RFQ_BASE_MAINNET_SECONDARY_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_SECONDARY_RPC_URL }}
      RFQ_BASE_MAINNET_READ_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/cloudflare-dev-deploy.sh
