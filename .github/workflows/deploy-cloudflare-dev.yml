name: Deploy Cloudflare dev (Base mainnet)
# Every green CI run on main redeploys the trading UI, the docs and the dev runtime container.
# Contracts are deployed and upgraded separately by dev-contracts.yml.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-dev
  cancel-in-progress: false
jobs:
  # Repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and PYTH_API_KEY turn this on.
  configured:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare secrets are not set; skipping the dev deploy"; fi
  deploy:
    needs: configured
    if: ${{ needs.configured.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
      RFQ_BASE_MAINNET_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_RPC_URL }}
      RFQ_BASE_MAINNET_SECONDARY_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_SECONDARY_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web && npm run build:docs && npm run validate:cloudflare-static
      - id: kv
        run: echo "id=$(node scripts/cloudflare-kv-namespace.mjs rfq-markets-dev-state)" >> "$GITHUB_OUTPUT"
      - name: Deploy dev runtime
        run: |
          sed "s/REPLACED_AT_DEPLOY/${{ steps.kv.outputs.id }}/" deploy/cloudflare/runtime/wrangler.dev.jsonc > deploy/cloudflare/runtime/wrangler.dev.generated.jsonc
          npx wrangler deploy --config deploy/cloudflare/runtime/wrangler.dev.generated.jsonc
      - name: Give the dev runtime its RPC and Pyth settings
        run: |
          node -e 'const rpc=process.env.RFQ_BASE_MAINNET_RPC_URL||"https://mainnet.base.org";if(!process.env.PYTH_API_KEY)throw new Error("PYTH_API_KEY is required");process.stdout.write(JSON.stringify({rpcUrl:rpc,secondaryRpcUrl:process.env.RFQ_BASE_MAINNET_SECONDARY_RPC_URL||rpc,pythApiKey:process.env.PYTH_API_KEY}))' \
            | npx wrangler secret put RFQ_DEV_RUNTIME_SECRETS --name rfq-markets-runtime-dev
      - run: npx wrangler deploy --config deploy/cloudflare/static/wrangler.web.dev.jsonc
      - run: npx wrangler deploy --config deploy/cloudflare/static/wrangler.docs.jsonc
