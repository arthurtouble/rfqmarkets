name: Deploy Cloudflare dev (Base mainnet)
# Every green CI run on main redeploys the three oracle nodes (one at a time), the trading UI, the docs
# and the dev runtime container.
# Contracts are deployed and upgraded separately by dev-contracts.yml.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-dev
  cancel-in-progress: false
jobs:
  # Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID turn this on.
  configured:
    # Only a push to this repository's main may deploy. A fork PR opened from its own main branch also
    # matches the workflow_run branch filter, so check the event, repository and branch explicitly.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare secrets are not set; skipping the dev deploy"; fi
  deploy:
    needs: configured
    if: ${{ needs.configured.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
      RFQ_BASE_MAINNET_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_RPC_URL }}
      RFQ_BASE_MAINNET_SECONDARY_RPC_URL: ${{ secrets.RFQ_BASE_MAINNET_SECONDARY_RPC_URL }}
      RFQ_BASE_MAINNET_READ_RPC_URLS: ${{ secrets.RFQ_BASE_MAINNET_READ_RPC_URLS }}
      RFQ_BASE_MAINNET_INDEXER_FALLBACK_RPC_URLS: ${{ secrets.RFQ_BASE_MAINNET_INDEXER_FALLBACK_RPC_URLS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash scripts/cloudflare-dev-deploy.sh
  # After every deploy, a real trader's journey on dev with the QA wallet (small trades on Base mainnet, gas
  # sponsored): open, add, partial close, TP/SL, isolated margin, withdraw, close all, with idle gaps that age
  # stored prices. A red run here means trading on dev is broken. Repository secrets RFQ_QA_WALLET_KEY (the QA
  # wallet's private key) and RFQ_QA_PASS (the dev geofence pass) turn it on.
  journey:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RFQ_JOURNEY_KEY: ${{ secrets.RFQ_QA_WALLET_KEY }}
      RFQ_QA_PASS: ${{ secrets.RFQ_QA_PASS }}
      RFQ_API_URL: https://dev.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
      RFQ_JOURNEY_NOTIONAL: "5"
      # The runtime container restarts with the deploy; give it time to come back and stream prices.
      RFQ_JOURNEY_READY_SECONDS: "600"
    steps:
      - id: check
        run: if [ -n "$RFQ_JOURNEY_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::RFQ_QA_WALLET_KEY is not set; the post-deploy trade journey did not run"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.check.outputs.ok == 'true'
        run: npm ci
      - if: steps.check.outputs.ok == 'true'
        run: npm run journey
