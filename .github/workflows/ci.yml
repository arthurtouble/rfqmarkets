name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The same gates as `npm test`, split so they run in parallel.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contracts
            foundry: true
            run: npm run test:contracts && npm run validate:upgrades
          # Service, script, web and edge unit tests, with coverage in the job summary.
          - name: services and simulator
            coverage: true
            run: npm run test:coverage && npm run test:python
          - name: types, docs and builds
            run: npm run format:check && npm run check:docs && npm run check:tokens && npm run typecheck && npm run build && npm run validate:cloudflare-static
          - name: dependency audit
            run: npm audit --omit=dev --audit-level=low
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: matrix.foundry
        with:
          version: v1.7.1
      - run: npm ci
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.coverage && !cancelled()
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 14
  # Browser tests for every app against the local stack, desktop and phone viewports.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  # Single required check that stays stable however the jobs above are split.
  validate:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success && test "${{ needs.e2e.result }}" = success
