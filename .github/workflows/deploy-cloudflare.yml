name: Deploy Cloudflare testnet
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-testnet
  cancel-in-progress: false
jobs:
  public-static:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web && npm run build:docs
      - run: npx wrangler deploy --dry-run --config deploy/cloudflare/static/wrangler.web.jsonc
      - run: npx wrangler deploy --config deploy/cloudflare/static/wrangler.web.jsonc
      - run: npx wrangler deploy --dry-run --config deploy/cloudflare/static/wrangler.docs.jsonc
      - run: npx wrangler deploy --config deploy/cloudflare/static/wrangler.docs.jsonc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
