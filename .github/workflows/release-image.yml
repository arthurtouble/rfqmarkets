name: Release host image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish and sign the validated image
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.host
          platforms: linux/amd64
          load: true
          tags: rfq-host-scan:${{ github.sha }}
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rfq-host-scan:${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: vulnerability-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-scan-${{ github.sha }}
          path: vulnerability-results.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Enforce high-severity vulnerability gate
        run: node scripts/vulnerability-gate.mjs

  publish:
    if: inputs.publish
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.host
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: vulnerability-results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-vulnerability-scan-${{ github.sha }}
          path: vulnerability-results.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Enforce published-image vulnerability gate
        run: node scripts/vulnerability-gate.mjs
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: host-image.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate host-image.spdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - run: npm run evidence:supply-chain -- supply-chain.json "${{ steps.build.outputs.digest }}"
      - run: |
          printf '%s\n' '${{ steps.build.outputs.digest }}' > host-image.digest
          sha256sum host-image.spdx.json vulnerability-results.sarif supply-chain.json host-image.digest > release-artifacts.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-image-${{ github.sha }}
          path: |
            host-image.digest
            host-image.spdx.json
            vulnerability-results.sarif
            supply-chain.json
            release-artifacts.sha256
          if-no-files-found: error
          retention-days: 90
