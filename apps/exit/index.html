<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'none'"><title>RFQ direct exits</title></head><body><main><h1>RFQ direct exits</h1><p>Owner transactions go directly to the settlement contract. Your wallet pays gas. Withdrawals require sufficient margin; position closes require trading to be paused. Claims require finalized resolution.</p><p id="deployment"></p><button id="connect">Connect and read account</button><pre id="state"></pre><label>USDC amount <input id="amount" inputmode="decimal" value="1"></label><button id="withdraw">Withdraw</button><label>Trade nonce <input id="nonce" value="0"></label><button id="cancel">Cancel nonce</button><label>Session address <input id="session"></label><button id="revoke">Revoke session</button><label>Market <select id="market"><option value="0">BTC</option><option value="1">ETH</option></select></label><label>Fresh oracle proof (hex) <textarea id="proof"></textarea></label><button id="close">Close paused position</button><button id="claim">Claim resolution payment</button><p role="status" id="status"></p></main><script type="module" src="/src/main.ts"></script></body></html>
